<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ritual teaser | 7 days to a calmer morning</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E1522">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0E1522;--gold:#C9974B;--gold2:#E6BC73;--cream:#F5F0E6;--dur:14s}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#070b12;color:var(--cream);font-family:Inter,system-ui,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
    .stage{position:relative;height:min(92vh,calc(92vw*16/9));aspect-ratio:9/16;background:radial-gradient(ellipse at 50% 38%,#16223a 0%,var(--navy) 62%);overflow:hidden;border-radius:14px}
    .clean .stage{height:100vh;border-radius:0}
    .ringbox{position:absolute;left:50%;top:36%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%)}
    .ringbox svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .track{fill:none;stroke:rgba(245,240,230,.12);stroke-width:3}
    .prog{fill:none;stroke:var(--gold2);stroke-width:4;stroke-linecap:round;stroke-dasharray:628.3;stroke-dashoffset:628.3;filter:drop-shadow(0 0 8px rgba(230,188,115,.7));animation:fill var(--dur) cubic-bezier(.45,.05,.3,1) infinite}
    .who{position:absolute;inset:0;display:grid;place-items:center;line-height:0;opacity:0;animation:who var(--dur) ease infinite}
    .who svg{width:46%;height:auto}
    .glow{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(230,188,115,.22),transparent 65%);opacity:0;animation:who var(--dur) ease infinite}
    .t{position:absolute;left:8%;right:8%;text-align:center;opacity:0}
    .t1{top:67%;font:500 clamp(1.7rem,7.2cqw,3rem)/1.2 "Playfair Display",serif;animation:t1 var(--dur) ease infinite}
    .t2{top:66%;font:600 clamp(1.9rem,7.6cqw,3.2rem)/1.5 "Noto Naskh Arabic",serif;animation:t2 var(--dur) ease infinite}
    .t3{top:76%;font:500 1.05rem/1.4 Inter,sans-serif;color:var(--gold2);letter-spacing:.02em;animation:t3 var(--dur) ease infinite}
    .t4{top:80%;font:500 1rem/1.4 Inter,sans-serif;color:rgba(245,240,230,.7);animation:t3 var(--dur) ease infinite}
    .stage{container-type:inline-size}
    @keyframes fill{0%{stroke-dashoffset:628.3}46%{stroke-dashoffset:0}92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes who{0%{opacity:0;transform:scale(.96)}6%{opacity:1;transform:scale(1)}92%{opacity:1}100%{opacity:0}}
    @keyframes t1{0%,10%{opacity:0;transform:translateY(8px)}16%,40%{opacity:1;transform:none}46%,100%{opacity:0}}
    @keyframes t2{0%,46%{opacity:0;transform:translateY(8px)}52%,76%{opacity:1;transform:none}82%,100%{opacity:0}}
    @keyframes t3{0%,80%{opacity:0}86%,94%{opacity:1}100%{opacity:0}}
    .ctl{display:flex;gap:.8rem;align-items:center;font-size:.9rem;color:rgba(245,240,230,.7)}
    .clean .ctl{display:none}
    .ctl button,.ctl a{font:inherit;color:var(--cream);background:transparent;border:1px solid rgba(245,240,230,.3);border-radius:999px;padding:.45rem .9rem;cursor:pointer;text-decoration:none}
    @media (prefers-reduced-motion:reduce){.prog{animation:none;stroke-dashoffset:0}.who,.glow{animation:none;opacity:1}.t1{animation:none;opacity:1}.t2,.t3,.t4{animation:none;opacity:0}}
  </style>
  <script src="../site.js" defer></script>
</head>
<body>
  <div class="stage" id="stage" aria-label="Animated teaser: a golden ring fills around your future self">
    <div class="ringbox">
      <div class="glow"></div>
      <svg class="r" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" class="track"/><circle cx="110" cy="110" r="100" class="prog" transform="rotate(-90 110 110)"/></svg>
      <div class="who" id="who"></div>
    </div>
    <p class="t t1">7 days to a calmer morning</p>
    <p class="t t2" dir="rtl" lang="ar">سبعة أيام لصباح أهدأ</p>
    <p class="t t3">Free 7-day Ritual challenge</p>
    <p class="t t4" dir="ltr">ahmedabouabass.github.io/challenge</p>
  </div>
  <div class="ctl"><button id="replay" type="button">Replay</button><a href="?clean=1">Clean view for recording</a><a href="../challenge/">Open the challenge</a></div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (/[?&]clean=1/.test(location.search)) document.body.classList.add('clean');
      var tries = 0;
      (function put() {
        if (window.RS) { var F = RS.future(); document.getElementById('who').innerHTML = RS.avatar(F.av, 160, 'Your future self'); }
        else if (tries++ < 40) setTimeout(put, 100);
      })();
      document.getElementById('replay').addEventListener('click', function () {
        var st = document.getElementById('stage'); st.style.display = 'none'; void st.offsetWidth; st.style.display = '';
      });
    });
  </script>
</body>
</html>
